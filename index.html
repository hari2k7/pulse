<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07060D" />
    <title>STRANGE — A Tech Fest Beyond Reality</title>
    <meta
      name="description"
      content="STRANGE — A Tech Fest Beyond Reality. Discover hackathons, workshops, and competitions across the multiverse."
    />
    <meta property="og:title" content="STRANGE — A Tech Fest Beyond Reality" />
    <meta
      property="og:description"
      content="A Tech Fest Beyond Reality. Discover hackathons, workshops, and competitions across the multiverse."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="STRANGE" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://strange.pages.dev/" />

    <!-- Early connection hints for API & images -->
    <link rel="preconnect" href="https://render72.pages.dev" crossorigin />
    <link rel="dns-prefetch" href="https://render72.pages.dev" />
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.pexels.com" />

    <!-- Early API dispatch and LCP image preload for instant route hydration -->
    <script>
      (function() {
        try {
          var p = window.location.pathname;
          function buildSrcSet(baseUrl, widths, ratio) {
            var base = baseUrl.split('?')[0];
            return widths.map(function(w) {
              var h = Math.round(w * ratio);
              return base + '?auto=compress&cs=tinysrgb&w=' + w + '&h=' + h + '&fit=crop ' + w + 'w';
            }).join(', ');
          }

          var isSim = window.location.search.indexOf('sim=') !== -1;
          var UUID_REGEX = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

          if (p !== '/') {
            document.documentElement.classList.add('route-subpage');
          }

          if (!isSim && p === '/favorites') {
            try {
              var favRaw = localStorage.getItem('strange:favorites');
              var cacheRaw = localStorage.getItem('strange_events_cache');
              if (favRaw && cacheRaw) {
                var favIds = JSON.parse(favRaw);
                var cached = JSON.parse(cacheRaw);
                var cachedEvents = cached && cached.events;
                if (Array.isArray(favIds) && favIds.length > 0 && Array.isArray(cachedEvents)) {
                  for (var fi = 0; fi < cachedEvents.length; fi++) {
                    if (cachedEvents[fi] && cachedEvents[fi].id === favIds[0]) {
                      var imgUrl = cachedEvents[fi].cover_image_url;
                      if (imgUrl && imgUrl.indexOf('images.pexels.com') !== -1) {
                        var l = document.createElement('link');
                        l.rel = 'preload';
                        l.as = 'image';
                        l.setAttribute('imagesrcset', buildSrcSet(imgUrl, [320, 440, 600], 2 / 3));
                        l.setAttribute('imagesizes', '(max-width: 640px) calc(100vw - 56px), (max-width: 1024px) 50vw, 380px');
                        l.fetchPriority = 'high';
                        l.crossOrigin = 'anonymous';
                        document.head.appendChild(l);
                      }
                      break;
                    }
                  }
                }
              }
            } catch(e) {}
          }

          if (!isSim && (p === '/events' || p === '/favorites')) {
            window.__EARLY_EVENTS_PROMISE__ = fetch('https://render72.pages.dev/api/test/events')
              .then(function(r) { return r.json(); })
              .then(function(d) {
                if (d && Array.isArray(d.events) && d.events.length > 0) {
                  window.__EARLY_EVENTS__ = d.events;
                  var targetEvent = null;
                  if (p === '/events') {
                    targetEvent = d.events[0];
                  } else if (p === '/favorites') {
                    try {
                      var favRaw = localStorage.getItem('strange:favorites');
                      if (favRaw) {
                        var favIds = JSON.parse(favRaw);
                        if (Array.isArray(favIds) && favIds.length > 0) {
                          for (var i = 0; i < d.events.length; i++) {
                            if (d.events[i] && d.events[i].id === favIds[0]) {
                              targetEvent = d.events[i];
                              break;
                            }
                          }
                        }
                      }
                    } catch(e) {}
                  }
                  if (targetEvent && targetEvent.cover_image_url) {
                    var u = targetEvent.cover_image_url;
                    if (u.indexOf('images.pexels.com') !== -1) {
                      var l = document.createElement('link');
                      l.rel = 'preload';
                      l.as = 'image';
                      l.setAttribute('imagesrcset', buildSrcSet(u, [320, 440, 600], 2 / 3));
                      l.setAttribute('imagesizes', '(max-width: 640px) calc(100vw - 56px), (max-width: 1024px) 50vw, 380px');
                      l.fetchPriority = 'high';
                      l.crossOrigin = 'anonymous';
                      document.head.appendChild(l);
                    }
                  }
                }
                return d;
              })
              .catch(function() {});
          } else if (!isSim && p.indexOf('/events/') === 0 && p.length > 8) {
            var parts = p.split('/');
            var id = parts[2];
            if (id && UUID_REGEX.test(id)) {
              window.__EARLY_EVENT_PROMISE__ = fetch('https://render72.pages.dev/api/test/events/' + encodeURIComponent(id))
                .then(function(r) { return r.json(); })
                .then(function(d) {
                  if (d && d.event) {
                    window.__EARLY_EVENT__ = d.event;
                    var u = d.event.banner_image_url || d.event.cover_image_url;
                    if (u && u.indexOf('images.pexels.com') !== -1) {
                      var l = document.createElement('link');
                      l.rel = 'preload';
                      l.as = 'image';
                      l.setAttribute('imagesrcset', buildSrcSet(u, [360, 540, 768, 1080, 1600], 9 / 16));
                      l.setAttribute('imagesizes', '(max-width: 640px) 100vw, (max-width: 1024px) 100vw, 1600px');
                      l.fetchPriority = 'high';
                      l.crossOrigin = 'anonymous';
                      document.head.appendChild(l);
                    }
                  }
                  return d;
                })
                .catch(function() {});
            }
          }
        } catch(e) {}
      })();
    </script>

    <!-- Preload only display font per Stage 1 & Hard rules -->
    <link
      rel="preload"
      href="/fonts/cinzel-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Static inline critical CSS: identical font stacks and metric-matched fallbacks for 0 CLS -->
    <style>
      @font-face {
        font-family: 'Cinzel';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/cinzel-latin-700-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Cinzel Fallback';
        src: local('Georgia'), local('Times New Roman'), local('serif');
        ascent-override: 96%;
        descent-override: 24%;
        line-gap-override: 0%;
        size-adjust: 100%;
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/inter-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter Fallback';
        src: local('Arial'), local('Helvetica Neue'), local('sans-serif');
        ascent-override: 90%;
        descent-override: 22%;
        line-gap-override: 0%;
        size-adjust: 100%;
      }

      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        background-color: #07060D;
        color: #F3EFE8;
        font-family: 'Inter', 'Inter Fallback', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-synthesis: none;
      }
      #root {
        min-height: 100vh;
      }
      .shell-container {
        min-height: 100vh;
        background-color: #07060D;
        display: flex;
        flex-direction: column;
      }
      .shell-header {
        height: 72px;
        display: flex;
        align-items: center;
        padding: 0 2rem;
        background: linear-gradient(180deg, rgba(7, 6, 13, 0.95) 0%, rgba(7, 6, 13, 0) 100%);
      }
      .shell-brand {
        font-family: 'Cinzel', 'Cinzel Fallback', Georgia, serif;
        font-weight: 700;
        font-size: 1.5rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #F3EFE8;
      }
      .shell-brand-accent {
        color: #FF7A1A;
      }
      .shell-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 5rem 1.5rem;
        max-width: 960px;
        margin: 0 auto;
      }
      .shell-tagline {
        font-size: 0.875rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #F5B642;
        margin-bottom: 1rem;
        font-weight: 600;
      }
      .shell-title {
        font-family: 'Cinzel', 'Cinzel Fallback', Georgia, serif;
        font-weight: 700;
        font-size: clamp(2.5rem, 7vw, 5rem);
        letter-spacing: 0.08em;
        margin: 0 0 1.5rem;
        line-height: 1.1;
        color: #F3EFE8;
      }
      .shell-title span {
        color: #FF7A1A;
      }
      .shell-desc {
        font-size: 1.25rem;
        color: #B8B3C7;
        margin: 0;
        line-height: 1.6;
        max-width: 650px;
      }
      .shell-page-container {
        max-width: 80rem;
        margin: 0 auto;
        padding-top: calc(72px + 32px);
        padding-bottom: 3rem;
        padding-left: 1rem;
        padding-right: 1rem;
        width: 100%;
        text-align: left;
        box-sizing: border-box;
      }
      .shell-page-title {
        font-family: 'Cinzel', 'Cinzel Fallback', Georgia, serif;
        font-weight: 700;
        font-size: 1.875rem;
        margin: 0;
        color: #F3EFE8;
        letter-spacing: 0.05em;
        line-height: 1.2;
      }
      @media (min-width: 640px) {
        .shell-page-container {
          padding-left: 1.5rem;
          padding-right: 1.5rem;
        }
        .shell-page-title {
          font-size: 2.25rem;
        }
      }
      @media (min-width: 768px) {
        .shell-page-container {
          padding-top: calc(72px + 48px);
          padding-bottom: 4rem;
          padding-left: 2rem;
          padding-right: 2rem;
        }
        .shell-page-title {
          font-size: 3rem;
        }
      }
      html.route-subpage .shell-content {
        display: block !important;
        justify-content: flex-start !important;
        align-items: flex-start !important;
        text-align: left !important;
        padding-top: calc(72px + 32px) !important;
        padding-bottom: 3rem !important;
        padding-left: 1rem !important;
        padding-right: 1rem !important;
        max-width: 80rem !important;
        margin: 0 auto !important;
      }
      @media (min-width: 640px) {
        html.route-subpage .shell-content {
          padding-left: 1.5rem !important;
          padding-right: 1.5rem !important;
        }
      }
      @media (min-width: 768px) {
        html.route-subpage .shell-content {
          padding-top: calc(72px + 48px) !important;
          padding-bottom: 4rem !important;
          padding-left: 2rem !important;
          padding-right: 2rem !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Static styled shell placeholder visible instantly without JS for maximum LCP & 0 CLS -->
      <div id="initial-shell" class="shell-container">
        <header class="shell-header">
          <div class="shell-brand">
            STR<span class="shell-brand-accent">A</span>NGE
          </div>
        </header>
        <main id="shell-body" class="shell-content">
          <div class="shell-tagline">A Tech Fest Beyond Reality.</div>
          <h1 class="shell-title">STRANGE</h1>
          <p class="shell-desc">Step through the Sling Ring into alternate dimensions of code, engineering, and innovation.</p>
          <a href="/events" style="margin-top: 1.5rem; display: inline-flex; align-items: center; justify-content: center; font-family: 'Cinzel', serif; font-size: 0.875rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; padding: 0.875rem 2rem; border-radius: 4px; background: #FF7A1A; color: #07060D; text-decoration: none;">Explore Events</a>
        </main>
      </div>
      <script>
        (function() {
          try {
            var p = window.location.pathname;
            var body = document.getElementById('shell-body');
            if (!body) return;
            if (p === '/favorites') {
              var favRaw = null;
              try { favRaw = localStorage.getItem('strange:favorites'); } catch(e) {}
              var favIds = favRaw ? JSON.parse(favRaw) : [];
              var favCount = Array.isArray(favIds) ? favIds.length : 0;
              body.className = 'shell-page-container';
              body.style.cssText = '';
              var headerHtml = '<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 1rem; border-bottom: 1px solid rgba(255,122,26,0.2); padding-bottom: 1.5rem;">' +
                '<div style="display: flex; flex-direction: column; gap: 0.25rem;">' +
                  '<div style="display: flex; align-items: center; gap: 0.75rem;">' +
                    '<h1 class="shell-page-title">FAVORITES</h1>' +
                    '<span style="padding: 0.25rem 0.625rem; border-radius: 9999px; font-size: 0.75rem; font-family: monospace; font-weight: 700; background: rgba(255,122,26,0.2); border: 1px solid rgba(255,122,26,0.4); color: #F5B642;">' + favCount + '</span>' +
                  '</div>' +
                  '<p style="font-size: 0.875rem; color: #B8B3C7; margin: 0;">Your curated collection of bookmarked dimensions and competitions.</p>' +
                '</div>' +
                '<a href="/events" style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #F5B642; text-decoration: none;">Explore More Events</a>' +
              '</div>';
              var contentHtml = '';
              if (favCount === 0) {
                contentHtml = '<div style="padding: 3rem 0;">' +
                  '<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; border-radius: 4px; background: rgba(24,24,24,0.6); border: 1px solid rgba(255,255,255,0.05); max-width: 36rem; margin: 2rem auto;">' +
                    '<div style="width: 4rem; height: 4rem; border-radius: 9999px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; color: #b3b3b3; margin-bottom: 1rem;">' +
                      '<svg style="width: 2rem; height: 2rem;" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>' +
                    '</div>' +
                    '<h2 style="font-size: 1.25rem; font-weight: 700; color: #fff; margin: 0 0 0.5rem;">No Favorites Yet</h2>' +
                    '<p style="font-size: 0.875rem; color: #b3b3b3; max-width: 28rem; margin: 0 0 1.5rem; line-height: 1.6;">Explore the multiverse index and click the heart icon on any event card to save it to your Sanctum archives.</p>' +
                    '<a href="/events" style="display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.75rem 1.5rem; border-radius: 0.375rem; background: #FF7A1A; color: #07060D; text-decoration: none;">Explore Events</a>' +
                  '</div>' +
                '</div>';
              } else {
                contentHtml = '<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; padding-top: 2rem;">' +
                  '<div style="height: 380px; border-radius: 0.75rem; background: #0D1020; border: 1px solid rgba(255,255,255,0.1);"></div>'.repeat(Math.min(favCount, 6)) +
                '</div>';
              }
              body.innerHTML = headerHtml + contentHtml;
            } else if (p === '/events') {
              body.className = 'shell-page-container';
              body.style.cssText = '';
              body.innerHTML = '<div style="border-bottom: 1px solid rgba(255,122,26,0.2); padding-bottom: 1.5rem;"><div style="display: flex; align-items: center; gap: 0.75rem;"><h1 class="shell-page-title">THE MULTIVERSE INDEX</h1></div><p style="font-size: 0.875rem; color: #B8B3C7; margin: 0.25rem 0 0;">Every reality has something waiting for you.</p></div>';
            } else if (p.indexOf('/events/') === 0 && p.length > 8) {
              body.className = '';
              body.style.cssText = 'width: 100%; padding-top: 4rem; text-align: left; box-sizing: border-box;';
              body.innerHTML = '<div style="width: 100%; height: 240px; background: #0D1020; position: relative; border-bottom: 1px solid rgba(255,255,255,0.05);"></div><div style="max-width: 80rem; margin: -1.5rem auto 0; padding: 0 1rem; width: 100%; position: relative; z-index: 10; box-sizing: border-box;"><div style="height: 28px; width: 110px; border-radius: 8px; background: #1A1030; margin-bottom: 0.75rem;"></div><div style="height: 40px; width: 65%; max-width: 500px; border-radius: 6px; background: #1A1030; margin-bottom: 0.75rem;"></div><div style="height: 18px; width: 85%; max-width: 600px; border-radius: 4px; background: rgba(26,16,48,0.6);"></div></div>';
            }
          } catch(e) {}
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
