<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="portal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A1A" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#FF7A1A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07060D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="35%" stop-color="#F5B642"/>
      <stop offset="70%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#F5B642"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4A0"/>
      <stop offset="50%" stop-color="#F5B642"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="sigil-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background: midnight #07060D -->
  <rect width="512" height="512" fill="#07060D"/>

  <!-- Subtle ambient inner glow -->
  <circle cx="256" cy="256" r="220" fill="url(#portal-glow)"/>

  <!-- Outer rune / sparks circle -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#F5B642" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="10 14"/>

  <!-- Primary portal ring -->
  <circle cx="256" cy="256" r="174" fill="none" stroke="url(#ring-grad)" stroke-width="28" filter="url(#sigil-glow)"/>

  <!-- Inner crisp ring -->
  <circle cx="256" cy="256" r="144" fill="none" stroke="#FFE4A0" stroke-width="5" stroke-opacity="0.85"/>

  <!-- Cardinal spark marks around ring -->
  <path d="M 256 46 L 256 84 M 256 428 L 256 466 M 46 256 L 84 256 M 428 256 L 466 256" stroke="#F5B642" stroke-width="7" stroke-linecap="round"/>
  <path d="M 108 108 L 134 134 M 404 404 L 378 378 M 108 404 L 134 378 M 404 108 L 378 134" stroke="#FF7A1A" stroke-width="6" stroke-linecap="round"/>

  <!-- Center Diamond Sigil (Doctor Strange inspired mystical diamond) -->
  <g transform="translate(256, 256)">
    <!-- Outer faceted diamond frame -->
    <path d="M 0 -84 L 84 0 L 0 84 L -84 0 Z" fill="none" stroke="url(#gold-grad)" stroke-width="14" stroke-linejoin="round"/>
    
    <!-- Inner diamond solid core -->
    <path d="M 0 -54 L 54 0 L 0 54 L -54 0 Z" fill="url(#ring-grad)"/>

    <!-- Central brilliant star / diamond spark -->
    <path d="M 0 -30 L 30 0 L 0 30 L -30 0 Z" fill="#FFF8E7"/>

    <!-- Horizontal & Vertical cross rays -->
    <line x1="-112" y1="0" x2="112" y2="0" stroke="#FFE4A0" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <line x1="0" y1="-112" x2="0" y2="112" stroke="#FFE4A0" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>